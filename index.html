<style>
/* Layout: kertas kolom akuntan — sidebar navigasi, lembar laporan di kanan, garis tunggal/ganda untuk subtotal & total */
:root{
  --paper:#EBEFEA; --sheet:#F9FBF8; --ink:#16231D; --ink-2:#4E5E56; --ink-3:#7A8A82;
  --rule:#D2DBD4; --rule-2:#AAB9AF; --accent:#2B4C9B; --accent-soft:#E2E8F6;
  --in:#1C7A4E; --in-soft:#E0F1E7; --out:#B03838; --out-soft:#F7E3E1; --warn:#9A6210; --warn-soft:#FAEFD9;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0E1411; --sheet:#151D19; --ink:#E4EBE6; --ink-2:#A0B0A7; --ink-3:#71827A;
  --rule:#25322B; --rule-2:#3A4B42; --accent:#93ABF1; --accent-soft:#1D2640;
  --in:#55C48D; --in-soft:#15291F; --out:#F07C7C; --out-soft:#331B1B; --warn:#E5AF55; --warn-soft:#2E2414; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0E1411; --sheet:#151D19; --ink:#E4EBE6; --ink-2:#A0B0A7; --ink-3:#71827A;
  --rule:#25322B; --rule-2:#3A4B42; --accent:#93ABF1; --accent-soft:#1D2640;
  --in:#55C48D; --in-soft:#15291F; --out:#F07C7C; --out-soft:#331B1B; --warn:#E5AF55; --warn-soft:#2E2414; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 32px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:0}
.top{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:18px 14px;border-bottom:1px solid var(--rule-2);margin-bottom:20px}
.brand{display:flex;flex-direction:column;gap:0;margin-right:auto;min-width:0;flex:1 1 200px}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:-.01em;margin:0;line-height:1.1}
.brand span{font-size:12px;color:var(--ink-2)}
.period{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--rule-2);border-radius:6px;overflow:hidden;background:var(--sheet)}
.seg button{border:0;background:none;padding:6px 11px;cursor:pointer;font-size:13px;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.stepper{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}
select.inp,input.inp{border:1px solid var(--rule-2);background:var(--sheet);border-radius:6px;padding:6px 9px;min-width:0}
.side{position:fixed;top:0;left:0;bottom:0;z-index:30;width:min(300px,86vw);display:flex;flex-direction:column;gap:2px;overflow-y:auto;
  background:var(--sheet);border-right:1px solid var(--rule-2);box-shadow:0 10px 40px rgba(0,0,0,.22);
  padding:calc(14px + env(safe-area-inset-top, 0px)) 12px calc(20px + env(safe-area-inset-bottom, 0px)) calc(12px + env(safe-area-inset-left, 0px));
  transform:translateX(-106%);visibility:hidden;transition:transform .22s ease, visibility 0s linear .22s}
.side.open{transform:none;visibility:visible;transition:transform .22s ease}
.side .dhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 4px 10px 10px;margin-bottom:6px;border-bottom:1px solid var(--rule)}
.side .dhead b{font-family:var(--f-display);font-size:17px}
.scrim{position:fixed;inset:0;z-index:25;background:rgba(10,20,15,.38)}
.menu-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border:1px solid var(--rule-2);border-radius:8px;background:var(--sheet);cursor:pointer;flex:none}
.menu-btn:hover{border-color:var(--ink-2)}
.menu-btn .dot{position:absolute;top:-6px;right:-8px}
.closeb{border:0;background:none;cursor:pointer;font-size:20px;line-height:1;padding:6px 8px;border-radius:6px;color:var(--ink-2)}
.closeb:hover{background:var(--paper);color:var(--ink)}
.side .grp{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:14px 10px 4px}
.side .dhead+.grp{margin-top:4px}
.side a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;color:var(--ink-2);text-decoration:none;font-weight:500}
.side a:hover{background:var(--paper);color:var(--ink)}
.side a[aria-current="page"]{background:var(--accent-soft);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent)}
.badge{font-family:var(--f-mono);font-size:11px;padding:1px 6px;border-radius:10px;background:var(--warn-soft);color:var(--warn)}
main{min-width:0}
.banner{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:10px 14px;border:1px dashed var(--warn);background:var(--warn-soft);color:var(--ink);border-radius:8px;margin-bottom:18px;font-size:13px}
.banner b{color:var(--warn)}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:22px 24px;min-width:0}
.sheet+.sheet{margin-top:18px}
.h2{font-family:var(--f-display);font-weight:700;font-size:21px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.lede{color:var(--ink-2);margin:4px 0 0;max-width:68ch}
.headrow{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule-2);background:var(--sheet);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.btn.danger{color:var(--out);border-color:var(--out)}
.btn.sm{padding:3px 8px;font-size:12px}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,215px),1fr));gap:0;border:1px solid var(--rule);border-radius:10px;background:var(--sheet);overflow:hidden}
.kpi{padding:14px 16px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);margin:0 -1px -1px 0;min-width:0}
.kpi .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:clamp(16px,1.35vw + 6px,21px);font-weight:500;margin-top:4px;line-height:1.25;letter-spacing:-.02em;overflow-wrap:anywhere}
.kpi .v small{font-size:.62em;font-weight:500;color:var(--ink-2);letter-spacing:0;margin-right:3px}
.kpi .d{font-size:12px;color:var(--ink-2);margin-top:2px}
.up{color:var(--in)} .dn{color:var(--out)}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;margin-top:18px}
.grid2 .sheet+.sheet{margin-top:0}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2);margin:6px 0 4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.chart svg{width:100%;height:auto;display:block}
.bars{display:flex;flex-direction:column;gap:9px;margin-top:10px}
.bar .lab{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.bar .lab span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{height:7px;background:var(--rule);border-radius:4px;margin-top:4px;overflow:hidden}
.bar .fill{height:100%;background:var(--out);border-radius:4px}
.alerts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:8px;font-size:13px;background:var(--paper)}
.alert .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}
/* tables */
.tw{overflow-x:auto;margin-inline:-4px;padding-inline:4px}
table{border-collapse:collapse;width:100%}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule-2);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
td.num,th.num{text-align:right;white-space:nowrap}
.data tbody tr:hover td{background:var(--paper)}
.data td.desc{min-width:220px;max-width:420px}
.tag{display:inline-block;font-size:10.5px;letter-spacing:.04em;padding:0 6px;border-radius:9px;margin-left:6px;vertical-align:1px;background:var(--paper);color:var(--ink-2);border:1px solid var(--rule)}
.tag.rv{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tag.pair{background:var(--accent-soft);color:var(--accent);border-color:transparent}
tr.rv td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
td.in{color:var(--in)} td.out{color:var(--out)}
select.cat{border:1px solid var(--rule);background:var(--sheet);border-radius:5px;padding:3px 6px;max-width:240px;font-size:12.5px}
.iconbtn{border:1px solid transparent;background:none;cursor:pointer;padding:2px 6px;border-radius:5px;color:var(--ink-3);font-size:13px}
.iconbtn:hover{border-color:var(--rule-2);color:var(--ink)}
.iconbtn.armed{color:var(--out);border-color:var(--out)}
/* statements */
.stmt-head{border-bottom:1px solid var(--rule-2);padding-bottom:12px;margin-bottom:6px}
.stmt-head .t{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.01em;text-transform:uppercase;margin:2px 0}
.stmt-head .s{color:var(--ink-2);font-size:13px}
.stmt td{border-bottom:0;padding:4px 10px}
.stmt td.num{min-width:130px}
.stmt tr.sec td{padding-top:16px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:12px}
.stmt tr.sec2 td{padding-top:10px;font-weight:600;color:var(--ink-2);font-size:13px}
.stmt tr.r td:first-child{padding-left:26px}
.stmt tr.r td.code{color:var(--ink-3);font-family:var(--f-mono);font-size:12px;width:64px;padding-left:10px}
.stmt tr.sub td{font-weight:600}
.stmt tr.sub td.num{border-top:1px solid var(--ink-2)}
.stmt tr.tot td{font-weight:700;padding-top:8px}
.stmt tr.tot td.num{border-top:1px solid var(--ink);border-bottom:3px double var(--ink)}
.stmt tr.note td{color:var(--ink-2);font-size:12px;padding-top:12px}
.stmt th{border-bottom:1px solid var(--rule-2)}
.ok{color:var(--in)} .bad{color:var(--out)}
/* journal */
.jr td{border-bottom:0;padding:3px 10px}
.jr tr.first td{border-top:1px solid var(--rule);padding-top:8px}
.jr td.acr{padding-left:34px}
.jr tr.memo td{color:var(--ink-3);font-size:12px;padding-bottom:8px}
.jr tfoot td{border-top:1px solid var(--ink);border-bottom:3px double var(--ink);font-weight:600}
/* upload */
.drop{border:2px dashed var(--rule-2);border-radius:12px;padding:30px 20px;text-align:center;background:var(--paper);cursor:pointer;transition:border-color .15s, background .15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop .big{font-family:var(--f-display);font-weight:700;font-size:19px}
.drop p{margin:6px auto 0;color:var(--ink-2);max-width:56ch}
.banks{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:12px}
.banks span{font-size:12px;padding:2px 10px;border:1px solid var(--rule-2);border-radius:12px;background:var(--sheet)}
.form{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--ink-2);font-weight:500}
textarea.inp{border:1px solid var(--rule-2);background:var(--sheet);border-radius:6px;padding:8px;width:100%;min-height:140px;font-family:var(--f-mono);font-size:12px}
.pw{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;background:var(--warn-soft);border-radius:8px;margin-top:10px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:13px;cursor:pointer}
details.more{margin-top:16px;border-top:1px solid var(--rule);padding-top:12px}
details.more summary{cursor:pointer;font-weight:600}
.muted{color:var(--ink-2)}
.small{font-size:12px}
.empty{padding:36px 10px;text-align:center;color:var(--ink-2)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom, 0px));background:var(--ink);color:var(--sheet);padding:9px 16px;border-radius:8px;font-size:13px;z-index:20;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.18)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--rule-2);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-1px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}.drop{transition:none}.side,.side.open{transition:none}}
@media (max-width: 860px){
  .grid2{grid-template-columns:minmax(0,1fr)}
  .sheet{padding:16px}
}
</style>

<script>
'use strict';
/*PARSER-START*/
const MON={jan:1,januari:1,january:1,feb:2,februari:2,february:2,peb:2,mar:3,maret:3,march:3,apr:4,april:4,mei:5,may:5,jun:6,juni:6,june:6,jul:7,juli:7,july:7,agu:8,agt:8,ags:8,aug:8,agustus:8,august:8,sep:9,sept:9,september:9,okt:10,oct:10,oktober:10,october:10,nov:11,nop:11,november:11,des:12,dec:12,desember:12,december:12};
const pad=n=>String(n).padStart(2,'0');
const iso=(y,m,d)=>y+'-'+pad(m)+'-'+pad(d);
const lastDay=(y,m)=>new Date(Date.UTC(y,m,0)).getUTCDate();

function parseMoney(s){
  const i=Math.max(s.lastIndexOf('.'),s.lastIndexOf(','));
  if(i<0) return +s;
  const tail=s.slice(i+1);
  if(tail.length<=2) return +(s.slice(0,i).replace(/[.,]/g,'')+'.'+tail);
  return +s.replace(/[.,]/g,'');
}
const MONEY_RE=/^([+-])?(?:Rp\.?)?([+-])?(\d{1,3}(?:[.,]\d{3})+(?:[.,]\d{1,2})?|\d+[.,]\d{2})(DB|CR|Db|Cr|db|cr)?$/;
function moneyTokens(L){
  const T=L.tokens, out=[];
  for(let i=0;i<T.length;i++){
    const m=T[i].s.match(MONEY_RE); if(!m) continue;
    const sg=m[1]||m[2]; let sign=sg==='-'?-1:sg==='+'?1:0, mark=m[4]?m[4].toUpperCase():null;
    const nx=T[i+1]&&T[i+1].s;
    if(!mark&&nx&&/^(DB|CR|D|K)$/i.test(nx)) mark=nx.toUpperCase();
    const pv=T[i-1]&&T[i-1].s;
    if(!sign&&pv){ const pm=pv.match(/^([+-])(Rp\.?)?$/); if(pm) sign=pm[1]==='-'?-1:1; }
    out.push({v:parseMoney(m[3]),x:T[i].x,w:L.w,sign,mark,i,line:L});
  }
  return out;
}
function dateAtStart(t,py,pm){
  const tries=[t]; const ix=t.match(/^\d{1,4}\s+(?=\d{1,2}[\s\/\-.])/); if(ix) tries.push(t.slice(ix[0].length));
  for(const s of tries){
    const off=t.length-s.length; let m,d,mo,y=null,len;
    if((m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4}|\d{2})(?!\d)/))){d=+m[1];mo=+m[2];y=+m[3];len=m[0].length;}
    else if((m=s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})(?!\d)/))){y=+m[1];mo=+m[2];d=+m[3];len=m[0].length;}
    else if((m=s.match(/^(\d{1,2})[\s\-]([A-Za-z]{3,9})\.?[\s\-,]+(\d{4}|\d{2})(?!\d)/))&&MON[m[2].toLowerCase()]){d=+m[1];mo=MON[m[2].toLowerCase()];y=+m[3];len=m[0].length;}
    else if((m=s.match(/^(\d{1,2})[\s\-]([A-Za-z]{3,9})\b/))&&MON[m[2].toLowerCase()]){d=+m[1];mo=MON[m[2].toLowerCase()];len=m[0].length;}
    else if((m=s.match(/^(\d{1,2})\/(\d{1,2})(?![\/\d])/))){d=+m[1];mo=+m[2];len=m[0].length;}
    else continue;
    if(!(d>=1&&d<=31&&mo>=1&&mo<=12)) continue;
    if(y==null){ y=py||new Date().getFullYear(); if(pm&&mo>pm+1) y--; }
    else if(y<100) y+=2000;
    if(y<1990||y>2100) continue;
    d=Math.min(d,lastDay(y,mo));
    return {iso:iso(y,mo,d),len:len+off};
  }
  return null;
}
function detectBank(text){
  const head=text.split('\n').slice(0,40).join('\n').toUpperCase(), T=text.toUpperCase();
  const pats={BCA:/BANK CENTRAL ASIA|\bBCA\b|KLIKBCA|MYBCA/g, BRI:/BANK RAKYAT INDONESIA|\bBRI\b|BRIMO/g, Mandiri:/MANDIRI|LIVIN/g, Jago:/BANK JAGO|\bJAGO\b|KANTONG/g};
  let best='Lainnya',bs=0;
  for(const k in pats){ const sc=(head.match(pats[k])||[]).length*5+(T.match(pats[k])||[]).length*0.2; if(sc>bs){bs=sc;best=k;} }
  return best;
}
function detectAcct(text){
  const m=text.match(/(?:no(?:mor)?\.?\s*(?:rek(?:ening)?|account)|account\s*(?:no\.?|number)|rekening)\s*[:.]?\s*([0-9][0-9\-\s]{5,24})/i);
  if(!m) return null; const d=m[1].replace(/\D/g,''); return d.length>=4?d.slice(-4):null;
}
function detectPeriod(text){
  const head=text.split('\n').slice(0,40).join(' ');
  let m=head.match(/(januari|februari|maret|april|mei|juni|juli|agustus|september|oktober|november|desember|january|february|march|may|june|july|august|october|december)\s+(\d{4})/i);
  if(m) return {month:MON[m[1].toLowerCase()],year:+m[2]};
  m=head.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4}|\d{2})/);
  if(m){ let y=+m[3]; if(y<100)y+=2000; return {month:+m[2],year:y}; }
  m=head.match(/\b(\d{1,2})\s+([A-Za-z]{3})\w*\s+(\d{4})/);
  if(m&&MON[m[2].toLowerCase()]) return {month:MON[m[2].toLowerCase()],year:+m[3]};
  return {month:null,year:null};
}
const OPEN_RE=/(saldo\s*awal|opening\s*balance|saldo\s*sebelumnya|beginning\s*balance|previous\s*balance|saldo\s*pembukaan)/i;
const CLOSE_RE=/(saldo\s*akhir|closing\s*balance|ending\s*balance|saldo\s*penutupan)/i;

function headerCols(L){

}
function guessDir(d){ return /\b(CR|KREDIT|SETOR|SETORAN|MASUK|DARI|TERIMA|INCOMING|BUNGA|GAJI|REFUND|CASHBACK|TPP|SP2D)\b/i.test(d)?'in':'out'; }

function parseStatement(lines,name){
  const all=lines.map(l=>l.text).join('\n');
  const bank=detectBank(all), last4=detectAcct(all), per=detectPeriod(all);
  let opening=null,closing=null,pendingSum=false,cols=null,cur=null; const blocks=[];
  const close=()=>{ if(cur){blocks.push(cur);cur=null;} };
  for(const L of lines){
    const t=L.text.trim(); if(!t) continue;
    if(pendingSum){ const mt=moneyTokens(L); if(mt.length>=2){ if(opening==null) opening=mt[0].v; closing=mt[mt.length-1].v; pendingSum=false; continue; } if(mt.length) pendingSum=false; }
    if(isHeader(t)){ close(); if(!L.paste) cols=headerCols(L); continue; }
    if(OPEN_RE.test(t)){ close(); const mt=moneyTokens(L); if(mt.length){ if(opening==null) opening=mt[mt.length-1].v*(mt[mt.length-1].sign<0?-1:1); } else pendingSum=true; continue; }
    if(CLOSE_RE.test(t)){ close(); const mt=moneyTokens(L); if(mt.length) closing=mt[mt.length-1].v; continue; }
    if(STOP_RE.test(t)||FOOT_RE.test(t)){ close(); continue; }
    const d=dateAtStart(t,per.year,per.month);
    if(d){ close(); cur={date:d.iso,dlen:d.len,lines:[L],page:L.page,cols}; continue; }
    if(cur&&L.page===cur.page&&cur.lines.length<6) cur.lines.push(L);
  }
  close();
  const txns=[]; let prev=opening;
  for(const b of blocks){
    // money tokens
    let money=[];
    if(b.lines[0].paste){ for(const L of b.lines){ const mt=moneyTokens(L); if(mt.length){money=mt;break;} } }
    else { for(const L of b.lines) money=money.concat(moneyTokens(L)); const right=money.filter(m=>m.x>=0.42*m.w); if(right.length) money=right; money.sort((a,b)=>a.x-b.x); }
    // description
    const used=new Set(); money.forEach(m=>{used.add(m.line.tokens[m.i]); if(m.mark){const n=m.line.tokens[m.i+1]; if(n&&/^(DB|CR|D|K)$/i.test(n.s)) used.add(n);} const p=m.line.tokens[m.i-1]; if(p&&/^[+-](Rp\.?)?$|^Rp\.?$/.test(p.s)) used.add(p);});
    const words=[];
    b.lines.forEach((L,li)=>{ let consumed=0; for(const k of L.tokens){ if(li===0&&consumed<b.dlen){consumed+=k.s.length+1;continue;} if(used.has(k)) continue; if(/^\d{1,2}[:.]\d{2}([:.]\d{2})?$/.test(k.s)||/^WIB$/i.test(k.s)||k.s==='-') continue; if(MONEY_RE.test(k.s)&&!b.lines[0].paste) continue; words.push(k.s);} });
    const clean=words.filter(w=>!/^ESB:/i.test(w)&&!/^\d{7}$/.test(w));
    const desc=(clean.length?clean:words).join(' ').replace(/\s+/g,' ').trim().slice(0,160)||'(tanpa keterangan)';
    let amt=null,dir=null,bal=null,review=false;
    const c=b.cols;
    if(c&&(c.dr!=null||c.cr!=null)&&money.length){
      let dr=0,cr=0,bb=null;
      for(const m of money){ const opts=[['dr',c.dr],['cr',c.cr],['bal',c.bal]].filter(o=>o[1]!=null); let best=null,bd=1e9; for(const o of opts){const dd=Math.abs(o[1]-m.x); if(dd<bd){bd=dd;best=o[0];}} if(best==='dr')dr+=m.v; else if(best==='cr')cr+=m.v; else bb=m.v; }
      if(dr>0&&!(cr>0)){amt=dr;dir='out';} else if(cr>0&&!(dr>0)){amt=cr;dir='in';}
      if(bb!=null) bal=bb;
    }
    const marked=money.filter(m=>m.mark||m.sign);
    if(amt==null&&marked.length){ const m=marked[0]; amt=m.v; dir=(m.mark&&/^(DB|D)$/.test(m.mark))||m.sign<0?'out':'in'; const after=money.filter(x=>x!==m&&x.x>m.x); if(after.length) bal=after[after.length-1].v; }
    if(amt==null&&money.length>=3){ const n=money.length; const a=money[n-3].v, cc=money[n-2].v; bal=money[n-1].v; if(a>0&&cc===0){amt=a;dir='out';} else if(cc>0&&a===0){amt=cc;dir='in';} }
    if(amt==null&&money.length>=2){ bal=money[money.length-1].v; amt=money[money.length-2].v; }
    if(amt==null&&money.length===1){ amt=money[0].v; }
    if(amt==null||!(amt>0)) continue;
    if(dir==null&&bal!=null&&prev!=null){ const df=bal-prev; if(Math.abs(Math.abs(df)-amt)<=1) dir=df>=0?'in':'out'; }
    if(dir==null){ if(bank==='BCA'&&money.length===1) dir='in'; else { dir=guessDir(desc); review=true; } }
    if(bal!=null&&prev!=null){ const exp=prev+(dir==='in'?amt:-amt); if(Math.abs(exp-bal)>1){ const fl=prev+(dir==='in'?-amt:amt); if(Math.abs(fl-bal)<=1) dir=dir==='in'?'out':'in'; else review=true; } }
    if(bal!=null) prev=bal; else if(prev!=null) prev+=dir==='in'?amt:-amt;
    txns.push({date:b.date,desc,amount:Math.round(amt*100)/100,dir,bal,review});
  }
  if(closing==null&&txns.length) closing=prev;
  let pfrom=null,pto=null; const pm2=all.match(/periode[^\n]{0,40}?(\d{1,2}[\s\/\-.][A-Za-z0-9]{2,9}[\s\/\-.]\d{2,4})\s*(?:-|s\.?\s?d\.?|sampai|to)\s*(\d{1,2}[\s\/\-.][A-Za-z0-9]{2,9}[\s\/\-.]\d{2,4})/i);
  if(pm2){ const a=dateAtStart(pm2[1],per.year,per.month), b=dateAtStart(pm2[2],per.year,per.month); if(a&&b&&a.iso<=b.iso){pfrom=a.iso;pto=b.iso;} }
  return {bank,last4,opening,closing,txns,name,pfrom,pto};
}
function linesFromText(text){
  const raw=text.split(/\r?\n/); const w=Math.max(40,...raw.map(s=>s.length));
  return raw.map(s=>{ const tokens=[]; const re=/\S+/g; let m; while((m=re.exec(s))) tokens.push({s:m[0],x:m.index}); return {page:1,w,text:s,tokens,paste:true}; });
}

const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
const PDFW='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
let pdfReady=null;
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('Gagal memuat pembaca PDF')); document.head.appendChild(s); }); }
function ensurePdf(){ if(!pdfReady) pdfReady=loadScript(PDFJS).then(()=>loadScript(PDFW)).then(()=>{ window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFW; }); return pdfReady; }
async function pdfLines(file,password){
  await ensurePdf();
  const data=new Uint8Array(await file.arrayBuffer());
  const doc=await window.pdfjsLib.getDocument({data,password:password||undefined,isEvalSupported:false,disableFontFace:true}).promise;
  const out=[];
  for(let p=1;p<=doc.numPages;p++){
    const page=await doc.getPage(p); const W=page.getViewport({scale:1}).width; const tc=await page.getTextContent();
    const items=tc.items.filter(i=>i.str&&i.str.trim()).map(i=>({s:i.str,x:i.transform[4],y:i.transform[5],w:i.width||0,h:Math.abs(i.transform[3])||8}));
    items.sort((a,b)=>(b.y-a.y)||(a.x-b.x));
    const rows=[];
    for(const it of items){ const r=rows[rows.length-1]; if(r&&Math.abs(r.y-it.y)<=Math.max(2,it.h*0.4)) r.items.push(it); else rows.push({y:it.y,items:[it]}); }
    for(const r of rows){
      r.items.sort((a,b)=>a.x-b.x);
      const merged=[];
      for(const it of r.items){ const pv=merged[merged.length-1]; if(pv&&it.x-(pv.x+pv.w)<0.6&&!/\s$/.test(pv.s)){pv.s+=it.s;pv.w=it.x+it.w-pv.x;} else merged.push({...it}); }
      const tokens=[];
      for(const it of merged){ const re=/\S+/g; let m; const L=it.s.length||1; while((m=re.exec(it.s))) tokens.push({s:m[0],x:it.x+(m.index/L)*it.w}); }
      out.push({page:p,w:W,text:merged.map(i=>i.s).join(' '),tokens});
    }
  }
  return out;
}

function rekapTable(){
  const [a,b]=dataRange(); if(!a) return '';
  const y=+U.key.slice(0,4), ya=+a.slice(0,4), yb=+b.slice(0,4);
  const row=(lab,s,e,cls)=>{ const t=totals(flowIn(s,e)); const nw=netWorth(balAt(e)).nw; return {lab,cls,v:[t.rev,t.exp,t.sur],sr:t.rev?t.sur/t.rev:null,nw,s,e}; };
  const sem=[row('Semester I '+y,y+'-01-01',y+'-06-30'),row('Semester II '+y,y+'-07-01',y+'-12-31')];
  const semTot=row('Jumlah tahun '+y,y+'-01-01',y+'-12-31','sub');
  const y0=Math.max(Math.min(ya,y),Math.max(ya,y)-14), y1=Math.max(yb,y), years=[];
  for(let i=Math.max(y0,y1-14);i<=y1;i++) years.push(row('Tahun '+i,i+'-01-01',i+'-12-31'));
  const all=row('Seluruh periode ('+fdate(a)+' s.d. '+fdate(b)+')',a,b,'tot');
  const tsv=['Periode\tPendapatan\tBeban\tSurplus (Defisit)\tRasio tabungan\tKekayaan bersih akhir'];
  const tr=r=>{ tsv.push([r.lab,...r.v.map(Math.round),r.sr==null?'':(r.sr*100).toFixed(1)+'%',Math.round(r.nw)].join('\t'));
    const cur=U.key&&range(U.key)[0]>=r.s&&range(U.key)[1]<=r.e&&!r.cls;
    return `<tr class="${r.cls||'r'}"><td>${esc(r.lab)}${cur?'<span class="tag pair">periode dipilih</span>':''}</td><td class="num">${acc(r.v[0])}</td><td class="num">${acc(r.v[1])}</td><td class="num ${r.v[2]<0?'dn':''}">${acc(r.v[2])}</td><td class="num">${r.sr==null?'–':(r.sr*100).toLocaleString('id-ID',{maximumFractionDigits:1})+'%'}</td><td class="num">${acc(r.nw)}</td></tr>`; };
  const sec=t=>{ tsv.push(t); return `<tr class="sec"><td colspan="6">${t}</td></tr>`; };
  const body=sec('Per semester · '+y)+sem.map(tr).join('')+tr(semTot)+sec('Per tahun')+years.map(tr).join('')+sec('Total keseluruhan')+tr(all);
  COPY.rk=tsv.join('\n');
  return `<div class="sheet"><div class="headrow" style="margin-bottom:6px"><div><div class="eyebrow">Rekap periodik</div><p class="lede small">Semester mengikuti tahun yang dipilih di atas. Kekayaan bersih dihitung per tanggal akhir masing-masing periode.</p></div><button class="btn" data-act="copy" data-id="rk">Salin ke Excel</button></div>
  <div class="tw"><table class="stmt"><thead><tr><th></th><th class="num">Pendapatan</th><th class="num">Beban</th><th class="num">Surplus (defisit)</th><th class="num">Rasio tabungan</th><th class="num">Kekayaan bersih akhir</th></tr></thead><tbody>${body}</tbody></table></div></div>`;
}
function niceMax(v){ if(v<=0) return 1; const p=Math.pow(10,Math.floor(Math.log10(v))); for(const m of [1,1.2,1.5,2,2.5,3,4,5,6,8,10]) if(m*p>=v) return m*p; return 10*p; }
function chart12(end){
  const ey=+end.slice(0,4), em=+end.slice(5,7), pts=[];
  for(let i=11;i>=0;i--){ let y=ey,m=em-i; while(m<=0){m+=12;y--;} const s=iso(y,m,1),e=iso(y,m,lastDay(y,m)); const t=totals(flowIn(s,e)); pts.push({lab:BLN3[m-1],yr:y,m,rev:t.rev,exp:t.exp,nw:netWorth(balAt(e)).nw,has:!!(t.rev||t.exp)}); }
  while(pts.length>3&&!pts[0].has) pts.shift();
  const W=720,H=270,L=58,R=58,T=14,B=30,pw=W-L-R,ph=H-T-B;
  const mx=niceMax(Math.max(1,...pts.map(p=>Math.max(p.rev,p.exp))));
  const nws=pts.map(p=>p.nw); let nmin=Math.min(...nws),nmax=Math.max(...nws); if(nmax-nmin<1){nmax+=1;nmin-=1;} const span=nmax-nmin; nmin-=span*0.15; nmax+=span*0.15;
  const y=v=>T+ph-(v/mx)*ph, yn=v=>T+ph-((v-nmin)/(nmax-nmin))*ph, bw=pw/pts.length, b=Math.max(3,Math.min(16,(bw-8)/2));
  let g='';
  for(let i=0;i<=4;i++){ const v=mx*i/4, yy=y(v); g+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--rule)" stroke-width="1"/><text x="${L-8}" y="${yy+4}" text-anchor="end" font-size="11" fill="var(--ink-3)" font-family="IBM Plex Mono, monospace">${short(v)}</text>`;
    const nvv=nmin+(nmax-nmin)*i/4; g+=`<text x="${W-R+8}" y="${yy+4}" font-size="11" fill="var(--accent)" font-family="IBM Plex Mono, monospace">${short(nvv)}</text>`; }
  pts.forEach((p,i)=>{ const cx=L+bw*i+bw/2;
    g+=`<rect x="${cx-b-1}" y="${y(p.rev)}" width="${b}" height="${Math.max(0,T+ph-y(p.rev))}" fill="var(--in)" rx="1.5"><title>${p.lab} ${p.yr} · Pendapatan Rp ${rp(p.rev)}</title></rect>`;
    g+=`<rect x="${cx+1}" y="${y(p.exp)}" width="${b}" height="${Math.max(0,T+ph-y(p.exp))}" fill="var(--out)" rx="1.5"><title>${p.lab} ${p.yr} · Beban Rp ${rp(p.exp)}</title></rect>`;
    g+=`<text x="${cx}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--ink-2)">${p.lab}${p.m===1||i===0?" '"+String(p.yr).slice(2):''}</text>`; });
  const path=pts.map((p,i)=>`${i?'L':'M'}${(L+bw*i+bw/2).toFixed(1)},${yn(p.nw).toFixed(1)}`).join(' ');
  g+=`<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>`;
  pts.forEach((p,i)=>{ g+=`<circle cx="${L+bw*i+bw/2}" cy="${yn(p.nw)}" r="${i===pts.length-1?4:2.5}" fill="${i===pts.length-1?'var(--accent)':'var(--sheet)'}" stroke="var(--accent)" stroke-width="1.5"><title>Kekayaan bersih akhir ${p.lab} ${p.yr}: Rp ${rp(p.nw)}</title></circle>`; });
  g+=`<line x1="${L}" x2="${W-R}" y1="${T+ph}" y2="${T+ph}" stroke="var(--rule-2)"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Pendapatan, beban, dan kekayaan bersih bulanan">${g}</svg>`;
}

function cashFlows(s,e){

  rekapTable(); add('Rekap','Rekap Ringkasan Keuangan','Per semester, per tahun, dan total keseluruhan',COPY.rk);
  const bl=id=>{ const b=S.banks.find(x=>x.id===id); return b?b.bank+' ••'+(b.last4||'????'):id; };
  add('Transaksi','Daftar Transaksi',per,['Tanggal\tRekening\tKeterangan\tMasuk\tKeluar\tSaldo bank\tKode akun\tAkun lawan\tStatus'].concat(S.txns.filter(t=>t.date>=s&&t.date<=e).map(t=>[t.date,bl(t.acct),t.desc.replace(/\t/g,' '),t.dir==='in'?Math.round(t.amount):'',t.dir==='out'?Math.round(t.amount):'',t.bal==null?'':Math.round(t.bal),t.cat,AC(t.cat).name,t.review?'Perlu dicek':''].join('\t'))).join('\n'));
  vJurnal(); add('Jurnal Umum','Jurnal Umum',per,COPY.jurnal);
  const keep=U.ledger, parts=[]; const mv=flowIn(s,e), b0=balAt(addDays(s,-1));
  for(const a of ACCTS().list){ if(!(Math.abs(mv[a.code]||0)>=0.5||ENT().some(x=>x.date>=s&&x.date<=e&&x.lines.some(l=>l.a===a.code))||(Math.abs(b0[a.code]||0)>=0.5&&a.type!=='R'&&a.type!=='X'))) continue; U.ledger=a.code; vBukuBesar(); parts.push(a.code+' '+a.name,COPY.bb,''); }
  U.ledger=keep; add('Buku Besar','Buku Besar',per,parts.join('\n'));
  vNeracaSaldo(); add('Neraca Saldo','Neraca Saldo','Per '+fdate(e),COPY.ns);
  vPosisi(); add('Posisi Keuangan','Laporan Posisi Keuangan','Per '+fdate(e)+' dan '+fdate(addDays(s,-1)),COPY.posisi);
  vSurplus(); add('Surplus Defisit','Laporan Surplus / Defisit',per,COPY.surplus);
  vArus(); add('Arus Kas','Laporan Arus Kas (metode langsung)',per,COPY.arus);
  vMatriks(); add('Laporan Periodik','Laporan Surplus / Defisit Periodik',{M:'Bulanan',Q:'Triwulanan',S:'Semesteran',Y:'Tahunan'}[U.g]+(U.g==='Y'?'':' tahun '+U.key.slice(0,4)),COPY.mx);
  const bb=balAt(e); add('Bagan Akun','Bagan Akun','Saldo per '+fdate(e),['Kode\tNama akun\tKelompok\tSaldo normal\tSaldo'].concat(ACCTS().list.map(a=>[a.code,a.name,TYPE_LABEL[a.type],a.type==='A'||a.type==='X'?'Debet':'Kredit',a.type==='R'||a.type==='X'?'':Math.round(nv(bb,a.code))].join('\t'))).join('\n'));
  XLSX.writeFile(wb,'Dana-eStatement-'+U.key+'.xlsx');
  render(); toast('File Excel diunduh.');
}

/* ---------- Import ---------- */
function ingest(res,label4,bankOverride){
  if(!res.txns.length){ toast('Tidak ada transaksi yang terbaca dari '+res.name+'. Coba fitur tempel teks.'); return 0; }
  if(S.sample){ const keep={owner:S.owner,rules:S.rules}; S=blank(); S.owner=keep.owner; S.rules=keep.rules; U.key=null; }
  const bank=bankOverride||res.bank, last4=label4||res.last4||'';
  const id=bank+'-'+(last4||'XXXX');
  if(!S.banks.find(b=>b.id===id)) S.banks.push({id,bank,last4});
  const sig=t=>[t.acct,t.date,Math.round(t.amount),t.dir,t.desc.slice(0,40),t.bal==null?'':Math.round(t.bal)].join('|');
  const have=new Set(S.txns.map(sig)); const sid=uid(); const fresh=new Set(); let tin=0,tout=0,n=0;
  for(const t of res.txns){ const o={id:uid(),date:t.date,acct:id,desc:t.desc,amount:t.amount,dir:t.dir,bal:t.bal,stmt:sid,parseReview:t.review}; if(have.has(sig(o))) continue; have.add(sig(o)); S.txns.push(o); fresh.add(o.id); n++; if(o.dir==='in') tin+=o.amount; else tout+=o.amount; }
  const ds=res.txns.map(t=>t.date).sort();
  let recon='n/a',diff=0; if(res.opening!=null&&res.closing!=null){ const all=res.txns.reduce((a,t)=>a+(t.dir==='in'?t.amount:-t.amount),0); diff=Math.round((res.opening+all-res.closing)*100)/100; recon=Math.abs(diff)<1?'ok':'selisih'; }
  S.statements.push({id:sid,name:res.name,bank,last4,acct:id,opening:res.opening,closing:res.closing,from:res.pfrom||ds[0],to:res.pto||ds[ds.length-1],count:n,tin,tout,recon,diff});
  S.txns.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  _acc=null; categorizeAll(fresh); const p=pairTransfers(); changed();
  toast(`${res.name}: ${n} transaksi baru dicatat${res.txns.length-n?`, ${res.txns.length-n} duplikat dilewati`:''}${p?`, ${p} pasangan transfer dikenali`:''}.`);
  return n;
}
async function readPdf(file,pw){
  try{ const lines=await pdfLines(file,pw); const res=parseStatement(lines,file.name.replace(/\.pdf$/i,'')); ingest(res); return true; }
  catch(e){ if(e&&e.name==='PasswordException'){ const ex=U.pending.find(p=>p.file===file); if(ex) ex.wrong=!!pw; else U.pending.push({file,wrong:!!pw}); return false; }
    toast('Gagal membaca '+file.name+': '+(e&&e.message||e)); return false; }
}
async function handleFiles(files){
  const list=[...files].filter(f=>/pdf$/i.test(f.type)||/\.pdf$/i.test(f.name)); if(!list.length){ toast('Pilih file PDF.'); return; }
  U.busy=true; render(); for(const f of list) await readPdf(f); U.busy=false; render();
}

/* ---------- Events ---------- */
document.addEventListener('click',async ev=>{
  const el=ev.target.closest('[data-act]'); if(!el) return; const a=el.dataset.act, id=el.dataset.id;
  if(a==='nav'){ setNav(!document.getElementById('side').classList.contains('open')); return; }
  if(a==='navclose'){ setNav(false); return; }
  if(a==='g'){ const [,e]=U.key?range(U.key):[0,dataRange()[1]]; U.g=el.dataset.g; U.key=e?keyFor(U.g,e):null; saveUI(); render(); }
  else if(a==='step'){ const d=+el.dataset.d; const nk=d>0?keyFor(U.g,addDays(range(U.key)[1],1)):prevKey(U.key); const ny=+nk.slice(0,4); if(ny>=1000&&ny<=9999){ U.key=nk; render(); } }
  else if(a==='pick'){ document.getElementById('fileIn').click(); }
  else if(a==='backup'){ backup(); }
  else if(a==='xlsx'){ exportXlsx(); }
  else if(a==='restorepick'){ document.getElementById('restoreIn').click(); }
  else if(a==='restorecancel'){ U.restore=null; render(); }
  else if(a==='restoreok'){ if(!U.restore) return; S=Object.assign(blank(),U.restore.state); U.restore=null; U.key=null; _acc=null; changed(); render(); toast('Data berhasil dipulihkan.'); }
  else if(a==='copy'){ const t=COPY[id]||''; try{ await navigator.clipboard.writeText(t); toast('Tersalin. Tempel di Excel atau Google Sheets.'); }catch(e){ const ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); let ok=false; try{ok=document.execCommand('copy');}catch(_){} ta.remove(); toast(ok?'Tersalin. Tempel di Excel atau Google Sheets.':'Browser menolak menyalin otomatis.'); } }
  else if(a==='rvfilter'){ U.f.rv=true; U.f.all=true; }
  else if(a==='tmore'){ U.tlim+=400; renderTxRows(); }
  else if(a==='jmore'){ U.jlim+=300; render(); }
  else if(a==='flip'){ const t=S.txns.find(x=>x.id===id); if(t){ t.dir=t.dir==='in'?'out':'in'; if(t.src!=='user'){ const [c,s,r]=autoCat(t); t.cat=c;t.src=s;t.review=r; } changed(); renderSide(); renderTxRows(); toast('Arah transaksi dibalik.'); } }
  else if(a==='deltx'){ if(el.classList.contains('armed')){ S.txns=S.txns.filter(x=>x.id!==id); changed(); renderSide(); renderTxRows(); toast('Transaksi dihapus.'); } else { el.classList.add('armed'); el.textContent='Hapus?'; setTimeout(()=>{ if(el.isConnected){ el.classList.remove('armed'); el.textContent='✕'; } },3000); } }
  else if(a==='delst'){ if(el.classList.contains('armed')){ S.txns=S.txns.filter(x=>x.stmt!==id); S.statements=S.statements.filter(x=>x.id!==id); const used=new Set(S.txns.map(t=>t.acct)); S.banks=S.banks.filter(b=>used.has(b.id)); changed(); render(); toast('Rekening koran dihapus.'); } else { el.classList.add('armed'); el.textContent='Yakin hapus?'; } }
  else if(a==='delman'){ S.manual=S.manual.filter(m=>m.id!==id); changed(); render(); toast('Jurnal memorial dihapus.'); }
  else if(a==='addman'){ const d=$v('mDate'),ds=$v('mDesc').trim(),dr=$v('mDr'),cr=$v('mCr'),amt=parseMoney(String($v('mAmt')).replace(/[^\d.,]/g,'')||'0');
    if(!d||!ds||!(amt>0)){ toast('Lengkapi tanggal, keterangan, dan jumlah.'); return; } if(dr===cr){ toast('Akun debet dan kredit harus berbeda.'); return; }
    S.manual.push({id:uid(),date:d,desc:ds,dr,cr,amount:amt}); changed(); render(); toast('Jurnal memorial dicatat.'); }
  else if(a==='pw'){ const i=+el.dataset.i, p=U.pending[i]; const pw=$v('pw-'+i); if(!pw) return; U.busy=true; render(); const ok=await readPdf(p.file,pw); if(ok) U.pending.splice(U.pending.indexOf(p),1); U.busy=false; render(); }
  else if(a==='paste'){ const txt=$v('pasteTxt'); if(!txt.trim()){ toast('Tempel teks terlebih dahulu.'); return; } const res=parseStatement(linesFromText(txt),'Teks tempel '+new Date().toLocaleDateString('id-ID')); const n=ingest(res,($v('pasteAcct')||'').replace(/\D/g,'').slice(-4)||null,$v('pasteBank')||null); if(n||res.txns.length) render(); }
  else if(a==='delrule'){ S.rules.splice(+el.dataset.i,1); changed(); render(); }
  else if(a==='reset'){ if(U.armReset){ const o=S.owner; S=blank(); S.owner=o; U.armReset=false; U.key=null; changed(); render(); toast('Semua data dihapus.'); } else { U.armReset=true; render(); setTimeout(()=>{ if(U.armReset){U.armReset=false; if(U.view==='akun') render();} },4000); } }
  else if(a==='sample'){ S=makeSample(); _acc=null; categorizeAll(); pairTransfers(); U.key=null; changed(); render(); }
});
const $v=id=>{ const e=document.getElementById(id); return e?e.value:''; };
document.addEventListener('change',ev=>{
  const el=ev.target, a=el.dataset&&el.dataset.chg; if(!a) return;
  if(a==='key'){ U.key=el.value; render(); }
  else if(a==='sub'){ U.key=U.key.slice(0,4)+'-'+el.value; render(); }
  else if(a==='year'){ const y=parseInt(el.value,10); if(!(y>=1000&&y<=9999)){ toast('Isi tahun 4 digit, misalnya 2027.'); el.value=U.key.slice(0,4); return; } U.key=U.g==='Y'?String(y):String(y)+U.key.slice(4); render(); }
  else if(a==='owner'){ S.owner=el.value.trim(); categorizeAll(); pairTransfers(); changed(); toast('Nama pemilik disimpan.'); }
  else if(a==='facct'){ U.f.acct=el.value; U.tlim=400; renderTxRows(); }
  else if(a==='frv'){ U.f.rv=el.checked; U.tlim=400; renderTxRows(); }
  else if(a==='fall'){ U.f.all=el.checked; U.tlim=400; renderTxRows(); }
  else if(a==='ledger'){ U.ledger=el.value; render(); }
  else if(a==='openDate'){ S.openDate=el.value; changed(); toast('Tanggal saldo awal disimpan.'); }
  else if(a==='open'){ const v=parseMoney(el.value.replace(/[^\d.,]/g,'')||'0'); if(v) S.openings[el.dataset.code]=v; else delete S.openings[el.dataset.code]; changed(); render(); toast('Saldo awal disimpan.'); }
  else if(a==='cat'){ const t=S.txns.find(x=>x.id===el.dataset.id); if(!t) return; t.cat=el.value; t.src='user'; t.review=false;
    const k=descKey(t.desc); let n=0;
    if(k){ S.rules=S.rules.filter(r=>!(r.key===k&&r.dir===t.dir)); S.rules.push({key:k,dir:t.dir,cat:t.cat});
      for(const o of S.txns){ if(o===t||o.src==='user'||o.dir!==t.dir||descKey(o.desc)!==k) continue; o.cat=t.cat; o.src='rule'; o.review=false; n++; } }
    changed(); renderSide(); renderTxRows(); toast(n?`Kategori diterapkan juga ke ${n} transaksi serupa.`:'Kategori disimpan.'); }
});
let qT; document.addEventListener('input',ev=>{ if(ev.target.dataset&&ev.target.dataset.inp==='fq'){ clearTimeout(qT); qT=setTimeout(()=>{ U.f.q=ev.target.value; U.tlim=400; renderTxRows(); },180); } });
document.addEventListener('keydown',ev=>{ if(ev.target.id==='drop'&&(ev.key==='Enter'||ev.key===' ')){ ev.preventDefault(); document.getElementById('fileIn').click(); } });
document.getElementById('fileIn').addEventListener('change',ev=>{ const f=ev.target.files; if(f&&f.length) handleFiles(f); ev.target.value=''; });
document.getElementById('restoreIn').addEventListener('change',ev=>{ const f=ev.target.files&&ev.target.files[0]; if(f) readRestore(f); ev.target.value=''; });
document.addEventListener('dragover',ev=>{ const d=ev.target.closest&&ev.target.closest('#drop'); if(d){ ev.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave',ev=>{ const d=ev.target.closest&&ev.target.closest('#drop'); if(d) d.classList.remove('over'); });
document.addEventListener('drop',ev=>{ const d=ev.target.closest&&ev.target.closest('#drop'); if(d){ ev.preventDefault(); d.classList.remove('over'); handleFiles(ev.dataTransfer.files); } });
function route(){ const h=location.hash.replace('#',''); U.view=VIEW_IDS.includes(h)?h:'ringkasan'; render(); setNav(false); window.scrollTo(0,0); }
document.getElementById('side').addEventListener('click',ev=>{ if(ev.target.closest('a[href^="#"]')) setNav(false); });
document.addEventListener('keydown',ev=>{ if(ev.key==='Escape'&&document.getElementById('side').classList.contains('open')) setNav(false); });
window.addEventListener('hashchange',route);
route();
