<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Dana e-Statement</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: bingkai hitam berisi rail ikon + kanvas putih membulat; kartu rekening hitam/putih; statistik & kategori beraksen pastel */
:root{
  --outer:#DCE6F4; --frame:#1B1B1D; --canvas:#F4F4F2; --sheet:#FFFFFF; --ink:#131314; --ink-2:#67676B; --ink-3:#9A9A9E;
  --rule:#ECECEA; --rule-2:#D9D9D6; --chip:#EFEFED;
  --p-sky:#CFE0F7; --p-sky-ink:#2F5D9E; --p-lav:#E4DEF8; --p-lav-ink:#5B4BA8; --p-mint:#D6EFDD; --p-mint-ink:#2A7A4B;
  --p-cream:#F7EDCB; --p-cream-ink:#8A6714; --p-peach:#F8DDD4; --p-peach-ink:#A5452C;
  --accent:#8DB6F0; --accent-soft:#E6EFFC; --in:#22874F; --out:#C9402F; --warn:#9A6A10; --warn-soft:#F7EDCB; --in-soft:#D6EFDD; --out-soft:#F8DDD4;
  --c-rev:#131314; --c-exp:#8DB6F0; --c-nw:#9B87E8;
  --shadow:0 1px 2px rgba(20,20,20,.04),0 8px 24px rgba(20,20,20,.05);
  --f-display:"Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --f-body:"Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --outer:#0C0D10; --frame:#000000; --canvas:#141518; --sheet:#1D1F23; --ink:#F1F1EF; --ink-2:#A8A8AD; --ink-3:#77777C;
  --rule:#2A2C31; --rule-2:#3A3C42; --chip:#26282D;
  --p-sky:#22324A; --p-sky-ink:#A9C8F3; --p-lav:#2D2846; --p-lav-ink:#C5B9F5; --p-mint:#1E3527; --p-mint-ink:#9BD9B0;
  --p-cream:#3A3220; --p-cream-ink:#EBD28E; --p-peach:#3E2621; --p-peach-ink:#F2B4A2;
  --accent:#8DB6F0; --accent-soft:#22324A; --in:#5FCB8C; --out:#F08A7A; --warn:#EBD28E; --warn-soft:#3A3220; --in-soft:#1E3527; --out-soft:#3E2621;
  --c-rev:#F1F1EF; --c-exp:#6F9BDA; --c-nw:#B3A3F0; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }}
:root[data-theme="dark"]{
  --outer:#0C0D10; --frame:#000000; --canvas:#141518; --sheet:#1D1F23; --ink:#F1F1EF; --ink-2:#A8A8AD; --ink-3:#77777C;
  --rule:#2A2C31; --rule-2:#3A3C42; --chip:#26282D;
  --p-sky:#22324A; --p-sky-ink:#A9C8F3; --p-lav:#2D2846; --p-lav-ink:#C5B9F5; --p-mint:#1E3527; --p-mint-ink:#9BD9B0;
  --p-cream:#3A3220; --p-cream-ink:#EBD28E; --p-peach:#3E2621; --p-peach-ink:#F2B4A2;
  --accent:#8DB6F0; --accent-soft:#22324A; --in:#5FCB8C; --out:#F08A7A; --warn:#EBD28E; --warn-soft:#3A3220; --in-soft:#1E3527; --out-soft:#3E2621;
  --c-rev:#F1F1EF; --c-exp:#6F9BDA; --c-nw:#B3A3F0; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--outer);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 28px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-variant-numeric:tabular-nums}
svg.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- frame ---------- */
.frame{max-width:1440px;margin:0 auto;display:grid;grid-template-columns:76px minmax(0,1fr);background:var(--frame);border-radius:30px;padding:12px 12px 12px 0;min-height:calc(100vh - 48px);box-shadow:0 30px 60px -30px rgba(20,30,50,.35)}
.rail{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;position:sticky;top:12px;align-self:start;height:calc(100vh - 72px)}
.rail .logo{width:44px;height:44px;border-radius:14px;background:var(--p-cream);color:#131314;display:grid;place-items:center;font-weight:800;font-size:20px;letter-spacing:-.04em;margin-bottom:14px;text-decoration:none}
.rail-btn{position:relative;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#8E8E93;border:0;background:none;cursor:pointer;text-decoration:none}
.rail-btn:hover{color:#FFFFFF;background:rgba(255,255,255,.07)}
.rail-btn[aria-current="page"]{color:#FFFFFF;background:rgba(255,255,255,.1)}
.rail-btn[aria-current="page"]::before{content:"";position:absolute;left:-16px;top:50%;width:7px;height:16px;margin-top:-8px;border-radius:0 6px 6px 0;background:#FFFFFF}
.rail-btn .rdot{position:absolute;top:8px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--p-cream)}
.rail .sp{flex:1}
.content{background:var(--canvas);border-radius:22px;padding:22px 26px 30px;min-width:0}

/* ---------- header ---------- */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:14px 18px;margin-bottom:16px}
.menu-btn{position:relative;display:none;align-items:center;justify-content:center;width:42px;height:42px;border:0;border-radius:12px;background:var(--frame);color:#fff;cursor:pointer;flex:none}
.menu-btn svg{width:20px;height:20px}
.menu-btn .dot{position:absolute;top:-6px;right:-8px}
.greet{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0;flex:1 1 220px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--p-lav);color:var(--p-lav-ink);display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.greet h1{font-family:var(--f-display);font-size:19px;font-weight:700;margin:0;letter-spacing:-.01em;line-height:1.2}
.greet p{margin:0;font-size:12.5px;color:var(--ink-2)}
.search{display:flex;align-items:center;gap:8px;background:var(--chip);border-radius:999px;padding:0 14px;height:42px;flex:0 1 340px;min-width:180px;color:var(--ink-3)}
.search input{border:0;background:none;outline:none;width:100%;color:var(--ink);font-size:13.5px}
.search:focus-within{box-shadow:0 0 0 2px var(--accent)}
.userbox{display:flex;align-items:center;gap:8px}
.upill{display:inline-flex;align-items:center;gap:9px;height:42px;padding:0 6px 0 14px;border-radius:999px;background:var(--frame);color:#fff;font-weight:600;font-size:13px}
.upill .ub{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;cursor:pointer}
.upill .ub:hover{background:rgba(255,255,255,.22)}
.upill .ub svg{width:16px;height:16px}
.role{font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:999px;background:var(--p-cream);color:#6b5210}
.period{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:20px}
.seg{display:inline-flex;background:var(--chip);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 13px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink-2);border-radius:999px}
.seg button[aria-pressed="true"]{background:var(--sheet);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.stepper{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}
select.inp,input.inp{border:1px solid var(--rule-2);background:var(--sheet);border-radius:10px;padding:7px 10px;min-width:0}
.stepper .inp{border-radius:999px;border-color:transparent;background:var(--chip);font-weight:600}

/* ---------- drawer ---------- */
.side{position:fixed;top:0;left:0;bottom:0;z-index:30;width:min(300px,86vw);display:flex;flex-direction:column;gap:2px;overflow-y:auto;
  background:var(--frame);color:#E9E9EA;box-shadow:0 10px 40px rgba(0,0,0,.35);
  padding:calc(16px + env(safe-area-inset-top, 0px)) 12px calc(20px + env(safe-area-inset-bottom, 0px)) calc(12px + env(safe-area-inset-left, 0px));
  transform:translateX(-106%);visibility:hidden;transition:transform .22s ease, visibility 0s linear .22s}
.side.open{transform:none;visibility:visible;transition:transform .22s ease}
.side .dhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 4px 12px 8px;margin-bottom:6px;border-bottom:1px solid rgba(255,255,255,.08)}
.side .dhead b{font-size:16px;font-weight:700;display:flex;align-items:center;gap:10px}
.side .dhead .logo{width:32px;height:32px;border-radius:10px;background:var(--p-cream);color:#131314;display:grid;place-items:center;font-weight:800}
.side .grp{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#7C7C82;margin:14px 10px 4px;font-weight:700}
.side a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;color:#B9B9BE;text-decoration:none;font-weight:500}
.side a .lbl{flex:1}
.side a:hover{background:rgba(255,255,255,.06);color:#fff}
.side a[aria-current="page"]{background:#fff;color:#131314}
.side .ufoot{margin-top:auto;padding:14px 8px 0;border-top:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:10px;font-size:12.5px;color:#9C9CA1}
.side .ufoot b{color:#fff}
.side .ufoot .btn{background:rgba(255,255,255,.08);color:#fff;border-color:transparent}
.closeb{border:0;background:none;cursor:pointer;font-size:18px;line-height:1;padding:6px 8px;border-radius:8px;color:#9C9CA1}
.closeb:hover{background:rgba(255,255,255,.08);color:#fff}
.scrim{position:fixed;inset:0;z-index:25;background:rgba(10,12,16,.45)}

/* ---------- generic ---------- */
main{min-width:0}
.badge{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--p-peach);color:var(--p-peach-ink)}
.banner{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--p-cream);color:#3d2f08;border-radius:16px;margin-bottom:18px;font-size:13px}
.banner b{font-weight:700}
.banner .btn{background:#131314;color:#fff;border-color:#131314}
.sheet{background:var(--sheet);border-radius:20px;padding:22px 24px;min-width:0;box-shadow:var(--shadow)}
.sheet+.sheet{margin-top:18px}
.h2{font-family:var(--f-display);font-weight:700;font-size:20px;margin:0;letter-spacing:-.015em;text-wrap:balance}
.lede{color:var(--ink-2);margin:4px 0 0;max-width:72ch}
.headrow{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 2px 12px}
.sec-h h3{margin:0;font-size:16px;font-weight:700;letter-spacing:-.01em}
.sec-h a,.sec-h span{font-size:12.5px;color:var(--ink-2);text-decoration:none}
.sec-h a:hover{color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule-2);background:var(--sheet);border-radius:999px;padding:7px 15px;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap;color:var(--ink);text-decoration:none}
.btn:hover{border-color:var(--ink-2)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.btn.pri:hover{opacity:.88}
.btn.danger{color:var(--out);border-color:var(--out);background:transparent}
.btn.sm{padding:4px 10px;font-size:12px}
.btn[disabled]{opacity:.6;cursor:progress}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.up{color:var(--in)} .dn{color:var(--out)}
.muted{color:var(--ink-2)} .small{font-size:12px}
.empty{padding:36px 10px;text-align:center;color:var(--ink-2)}
.empty .btn{margin-top:12px}

/* ---------- dashboard ---------- */
.dash{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
.dash-main{display:flex;flex-direction:column;gap:22px;min-width:0}
.dash-main>.sheet{margin-top:0}
.cards{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:16px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x mandatory}
.bcard{position:relative;border-radius:22px;padding:20px 22px;min-height:170px;display:flex;flex-direction:column;gap:6px;overflow:hidden;scroll-snap-align:start;isolation:isolate}
.bcard::after{content:"";position:absolute;inset:0 0 0 38%;z-index:-1;background-image:radial-gradient(circle,currentColor 1.1px,transparent 1.6px);background-size:9px 9px;opacity:.10;
  -webkit-mask-image:radial-gradient(ellipse 70% 80% at 70% 50%,#000 40%,transparent 75%);mask-image:radial-gradient(ellipse 70% 80% at 70% 50%,#000 40%,transparent 75%)}
.bcard.dark{background:#1B1B1D;color:#fff}
.bcard.light{background:var(--sheet);color:var(--ink);box-shadow:var(--shadow)}
.bcard.pastel{background:var(--p-sky);color:#13233b}
.bc-top{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:600;opacity:.8}
.bc-bal{font-size:clamp(22px,2.2vw,28px);font-weight:700;letter-spacing:-.02em;margin-top:8px;line-height:1.15;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.bc-bal small{font-size:.55em;font-weight:600;opacity:.65;margin-right:4px}
.bc-num{font-size:14px;font-weight:600;letter-spacing:.06em;opacity:.85}
.bc-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;font-size:12px;opacity:.75}
.bc-mark{font-weight:800;font-style:italic;font-size:17px;letter-spacing:-.02em;opacity:1}
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.qa a{display:flex;align-items:center;gap:10px;padding:10px 14px 10px 10px;border-radius:18px;background:var(--sheet);color:var(--ink);text-decoration:none;font-weight:600;font-size:13.5px;box-shadow:var(--shadow)}
.qa a .qi{width:36px;height:36px;border-radius:50%;background:var(--frame);color:#fff;display:grid;place-items:center;flex:none}
.qa a .qi svg{width:17px;height:17px}
.qa a.on{background:var(--accent);color:#0f2240}
.qa a.on .qi{background:#fff;color:#131314}
.qa a .badge{margin-left:auto}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:14px}
.tile{border-radius:20px;padding:16px 18px;min-width:0;display:flex;flex-direction:column;gap:4px}
.tile .tl{font-size:12.5px;font-weight:600;opacity:.8}
.tile .tv{font-size:clamp(17px,1.25vw + 6px,22px);font-weight:700;letter-spacing:-.02em;line-height:1.2;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.tile .tv small{font-size:.6em;font-weight:600;opacity:.7;margin-right:3px}
.tile .td{font-size:11.5px;font-weight:600;margin-top:auto;padding-top:8px;opacity:.85}
.p-mint{background:var(--p-mint);color:var(--p-mint-ink)} .p-peach{background:var(--p-peach);color:var(--p-peach-ink)}
.p-lav{background:var(--p-lav);color:var(--p-lav-ink)} .p-cream{background:var(--p-cream);color:var(--p-cream-ink)} .p-sky{background:var(--p-sky);color:var(--p-sky-ink)}
.tile .tv,.tile .tl{color:var(--ink)}
.chartcard{background:var(--accent-soft)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--ink-2);margin:6px 0 4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chart svg{width:100%;height:auto;display:block}
.stat{position:sticky;top:12px;background:var(--sheet);border-radius:26px;padding:22px 20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:16px}
.stat .sh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.stat .sh h3{margin:0;font-size:17px;font-weight:700}
.stat .sh span{font-size:11.5px;color:var(--ink-2);border:1px solid var(--rule-2);border-radius:999px;padding:3px 10px}
.donut{display:block;width:100%;max-width:240px;height:auto;margin:0 auto}
.dleg{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:11.5px;color:var(--ink-2)}
.dleg span{display:flex;gap:6px;align-items:center;min-width:0}
.dleg span em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dleg i{width:10px;height:10px;border-radius:3px;flex:none}
.txl{display:flex;flex-direction:column;gap:12px}
.txi{display:flex;align-items:center;gap:12px;min-width:0}
.tico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none}
.tico svg{width:20px;height:20px}
.tico.dk{background:var(--frame);color:#fff}
.txi .tt{flex:1;min-width:0}
.txi .tt b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txi .tt span{display:block;font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txi .ta{font-weight:700;font-size:13.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.alerts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;font-size:12.5px;background:var(--canvas)}
.alert .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}
.alert a{color:inherit;font-weight:700}
.bars{display:flex;flex-direction:column;gap:9px;margin-top:10px}

/* ---------- tables ---------- */
.tw{overflow-x:auto;margin-inline:-4px;padding-inline:4px}
table{border-collapse:collapse;width:100%}
th{font-size:11.5px;color:var(--ink-3);font-weight:600;text-align:left;padding:9px 10px;border-bottom:1px solid var(--rule);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
td.num,th.num{text-align:right;white-space:nowrap}
.data tbody tr:hover td{background:var(--canvas)}
.data td.desc{min-width:220px;max-width:420px}
.tag{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:1px;background:var(--chip);color:var(--ink-2)}
.tag.rv{background:var(--p-peach);color:var(--p-peach-ink)}
.tag.pair{background:var(--p-sky);color:var(--p-sky-ink)}
.tag.p-mint{background:var(--p-mint);color:var(--p-mint-ink)} .tag.p-sky{background:var(--p-sky);color:var(--p-sky-ink)} .tag.p-peach{background:var(--p-peach);color:var(--p-peach-ink)} .tag.p-cream{background:var(--p-cream);color:var(--p-cream-ink)}
tr.rv td:first-child{box-shadow:inset 3px 0 0 var(--p-peach-ink)}
td.in{color:var(--in);font-weight:600} td.out{color:var(--out);font-weight:600}
select.cat{border:1px solid var(--rule-2);background:var(--sheet);border-radius:8px;padding:4px 7px;max-width:240px;font-size:12.5px}
.iconbtn{border:1px solid transparent;background:none;cursor:pointer;padding:3px 7px;border-radius:8px;color:var(--ink-3);font-size:13px}
.iconbtn:hover{border-color:var(--rule-2);color:var(--ink)}
.iconbtn.armed{color:var(--out);border-color:var(--out)}
.stmt-head .t{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.01em;margin:2px 0}
.stmt-head .s{color:var(--ink-2);font-size:13px}
.stmt td{border-bottom:0;padding:5px 10px}
.stmt td.num{min-width:130px}
.stmt tr.sec td{padding-top:18px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;font-size:11.5px}
.stmt tr.sec2 td{padding-top:10px;font-weight:600;color:var(--ink-2);font-size:13px}
.stmt tr.r td:first-child{padding-left:26px}
.stmt tr.sub td{font-weight:600}

<script>
'use strict';
/*PARSER-START*/
const MON={jan:1,januari:1,january:1,feb:2,februari:2,february:2,peb:2,mar:3,maret:3,march:3,apr:4,april:4,mei:5,may:5,jun:6,juni:6,june:6,jul:7,juli:7,july:7,agu:8,agt:8,ags:8,aug:8,agustus:8,august:8,sep:9,sept:9,september:9,okt:10,oct:10,oktober:10,october:10,nov:11,nop:11,november:11,des:12,dec:12,desember:12,december:12};
const pad=n=>String(n).padStart(2,'0');
const iso=(y,m,d)=>y+'-'+pad(m)+'-'+pad(d);
const lastDay=(y,m)=>new Date(Date.UTC(y,m,0)).getUTCDate();

function parseMoney(s){
  const i=Math.max(s.lastIndexOf('.'),s.lastIndexOf(','));
  if(i<0) return +s;
  const tail=s.slice(i+1);
  if(tail.length<=2) return +(s.slice(0,i).replace(/[.,]/g,'')+'.'+tail);
  return +s.replace(/[.,]/g,'');
}
const MONEY_RE=/^([+-])?(?:Rp\.?)?([+-])?(\d{1,3}(?:[.,]\d{3})+(?:[.,]\d{1,2})?|\d+[.,]\d{2})(DB|CR|Db|Cr|db|cr)?$/;
function moneyTokens(L){
  const T=L.tokens, out=[];
  for(let i=0;i<T.length;i++){
    const m=T[i].s.match(MONEY_RE); if(!m) continue;
    const sg=m[1]||m[2]; let sign=sg==='-'?-1:sg==='+'?1:0, mark=m[4]?m[4].toUpperCase():null;
    const nx=T[i+1]&&T[i+1].s;
    if(!mark&&nx&&/^(DB|CR|D|K)$/i.test(nx)) mark=nx.toUpperCase();
    const pv=T[i-1]&&T[i-1].s;
    if(!sign&&pv){ const pm=pv.match(/^([+-])(Rp\.?)?$/); if(pm) sign=pm[1]==='-'?-1:1; }
    out.push({v:parseMoney(m[3]),x:T[i].x,w:L.w,sign,mark,i,line:L});
  }
  return out;
}
function dateAtStart(t,py,pm){
  const tries=[t]; const ix=t.match(/^\d{1,4}\s+(?=\d{1,2}[\s\/\-.])/); if(ix) tries.push(t.slice(ix[0].length));
  for(const s of tries){
    const off=t.length-s.length; let m,d,mo,y=null,len;
    if((m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4}|\d{2})(?!\d)/))){d=+m[1];mo=+m[2];y=+m[3];len=m[0].length;}
    else if((m=s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})(?!\d)/))){y=+m[1];mo=+m[2];d=+m[3];len=m[0].length;}
    else if((m=s.match(/^(\d{1,2})[\s\-]([A-Za-z]{3,9})\.?[\s\-,]+(\d{4}|\d{2})(?!\d)/))&&MON[m[2].toLowerCase()]){d=+m[1];mo=MON[m[2].toLowerCase()];y=+m[3];len=m[0].length;}
    else if((m=s.match(/^(\d{1,2})[\s\-]([A-Za-z]{3,9})\b/))&&MON[m[2].toLowerCase()]){d=+m[1];mo=MON[m[2].toLowerCase()];len=m[0].length;}
    else if((m=s.match(/^(\d{1,2})\/(\d{1,2})(?![\/\d])/))){d=+m[1];mo=+m[2];len=m[0].length;}
    else continue;
    if(!(d>=1&&d<=31&&mo>=1&&mo<=12)) continue;
    if(y==null){ y=py||new Date().getFullYear(); if(pm&&mo>pm+1) y--; }
    else if(y<100) y+=2000;
    if(y<1990||y>2100) continue;
    d=Math.min(d,lastDay(y,mo));
    return {iso:iso(y,mo,d),len:len+off};
  }
  return null;
}
function detectBank(text){
  const head=text.split('\n').slice(0,40).join('\n').toUpperCase(), T=text.toUpperCase();
  const pats={BCA:/BANK CENTRAL ASIA|\bBCA\b|KLIKBCA|MYBCA/g, BRI:/BANK RAKYAT INDONESIA|\bBRI\b|BRIMO/g, Mandiri:/MANDIRI|LIVIN/g, Jago:/BANK JAGO|\bJAGO\b|KANTONG/g};
  let best='Lainnya',bs=0;
  for(const k in pats){ const sc=(head.match(pats[k])||[]).length*5+(T.match(pats[k])||[]).length*0.2; if(sc>bs){bs=sc;best=k;} }
  return best;
}
function detectAcct(text){
  const m=text.match(/(?:no(?:mor)?\.?\s*(?:rek(?:ening)?|account)|account\s*(?:no\.?|number)|rekening)\s*[:.]?\s*([0-9][0-9\-\s]{5,24})/i);
  if(!m) return null; const d=m[1].replace(/\D/g,''); return d.length>=4?d.slice(-4):null;
}
function detectPeriod(text){
  const head=text.split('\n').slice(0,40).join(' ');
  let m=head.match(/(januari|februari|maret|april|mei|juni|juli|agustus|september|oktober|november|desember|january|february|march|may|june|july|august|october|december)\s+(\d{4})/i);
  if(m) return {month:MON[m[1].toLowerCase()],year:+m[2]};
  m=head.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4}|\d{2})/);
  if(m){ let y=+m[3]; if(y<100)y+=2000; return {month:+m[2],year:y}; }
  m=head.match(/\b(\d{1,2})\s+([A-Za-z]{3})\w*\s+(\d{4})/);
  if(m&&MON[m[2].toLowerCase()]) return {month:MON[m[2].toLowerCase()],year:+m[3]};
  return {month:null,year:null};
}
const OPEN_RE=/(saldo\s*awal|opening\s*balance|saldo\s*sebelumnya|beginning\s*balance|previous\s*balance|saldo\s*pembukaan)/i;
const CLOSE_RE=/(saldo\s*akhir|closing\s*balance|ending\s*balance|saldo\s*penutupan)/i;
const STOP_RE=/^(mutasi\s*(cr|db|kredit|debet)|total|jumlah\s*(mutasi|transaksi|debet|kredit)|halaman|page\s*\d|bersambung|continued|catatan|informasi|apabila|ringkasan|summary)/i;
const FOOT_RE=/^\d{2}\/\d{2}\/\d{4}\s+\d{1,2}:\d{2}(:\d{2})?(\s*[AP]M)?\s*$/i;
function isHeader(t){ return /\b(tanggal|tgl|date|posting)\b/i.test(t)&&/\b(saldo|balance)\b/i.test(t)&&!/\d{1,3}[.,]\d{3}/.test(t); }
function headerCols(L){
  const c={};
  for(const k of L.tokens){ const s=k.s.toLowerCase().replace(/[^a-z]/g,'');
    if(/^(debet|debit|db)$/.test(s)) c.dr=k.x; else if(/^(kredit|credit|cr)$/.test(s)) c.cr=k.x; else if(/^(saldo|balance)$/.test(s)) c.bal=k.x; }
  return c;
}
function guessDir(d){ return /\b(CR|KREDIT|SETOR|SETORAN|MASUK|DARI|TERIMA|INCOMING|BUNGA|GAJI|REFUND|CASHBACK|TPP|SP2D)\b/i.test(d)?'in':'out'; }

function parseStatement(lines,name){
  const all=lines.map(l=>l.text).join('\n');
  const bank=detectBank(all), last4=detectAcct(all), per=detectPeriod(all);
  let opening=null,closing=null,pendingSum=false,cols=null,cur=null; const blocks=[];
  const close=()=>{ if(cur){blocks.push(cur);cur=null;} };
  for(const L of lines){
    const t=L.text.trim(); if(!t) continue;
    if(pendingSum){ const mt=moneyTokens(L); if(mt.length>=2){ if(opening==null) opening=mt[0].v; closing=mt[mt.length-1].v; pendingSum=false; continue; } if(mt.length) pendingSum=false; }
    if(isHeader(t)){ close(); if(!L.paste) cols=headerCols(L); continue; }
    if(OPEN_RE.test(t)){ close(); const mt=moneyTokens(L); if(mt.length){ if(opening==null) opening=mt[mt.length-1].v*(mt[mt.length-1].sign<0?-1:1); } else pendingSum=true; continue; }
    if(CLOSE_RE.test(t)){ close(); const mt=moneyTokens(L); if(mt.length) closing=mt[mt.length-1].v; continue; }
    if(STOP_RE.test(t)||FOOT_RE.test(t)){ close(); continue; }
    const d=dateAtStart(t,per.year,per.month);
    if(d){ close(); cur={date:d.iso,dlen:d.len,lines:[L],page:L.page,cols}; continue; }
    if(cur&&L.page===cur.page&&cur.lines.length<6) cur.lines.push(L);
  }
  close();
  const txns=[]; let prev=opening;
  for(const b of blocks){
    // money tokens
    let money=[];
    if(b.lines[0].paste){ for(const L of b.lines){ const mt=moneyTokens(L); if(mt.length){money=mt;break;} } }
    else { for(const L of b.lines) money=money.concat(moneyTokens(L)); const right=money.filter(m=>m.x>=0.42*m.w); if(right.length) money=right; money.sort((a,b)=>a.x-b.x); }
    // description
    const used=new Set(); money.forEach(m=>{used.add(m.line.tokens[m.i]); if(m.mark){const n=m.line.tokens[m.i+1]; if(n&&/^(DB|CR|D|K)$/i.test(n.s)) used.add(n);} const p=m.line.tokens[m.i-1]; if(p&&/^[+-](Rp\.?)?$|^Rp\.?$/.test(p.s)) used.add(p);});
    const words=[];
    b.lines.forEach((L,li)=>{ let consumed=0; for(const k of L.tokens){ if(li===0&&consumed<b.dlen){consumed+=k.s.length+1;continue;} if(used.has(k)) continue; if(/^\d{1,2}[:.]\d{2}([:.]\d{2})?$/.test(k.s)||/^WIB$/i.test(k.s)||k.s==='-') continue; if(MONEY_RE.test(k.s)&&!b.lines[0].paste) continue; words.push(k.s);} });
    const clean=words.filter(w=>!/^ESB:/i.test(w)&&!/^\d{7}$/.test(w));
    const desc=(clean.length?clean:words).join(' ').replace(/\s+/g,' ').trim().slice(0,160)||'(tanpa keterangan)';
    let amt=null,dir=null,bal=null,review=false;
    const c=b.cols;
    if(c&&(c.dr!=null||c.cr!=null)&&money.length){
      let dr=0,cr=0,bb=null;
      for(const m of money){ const opts=[['dr',c.dr],['cr',c.cr],['bal',c.bal]].filter(o=>o[1]!=null); let best=null,bd=1e9; for(const o of opts){const dd=Math.abs(o[1]-m.x); if(dd<bd){bd=dd;best=o[0];}} if(best==='dr')dr+=m.v; else if(best==='cr')cr+=m.v; else bb=m.v; }
      if(dr>0&&!(cr>0)){amt=dr;dir='out';} else if(cr>0&&!(dr>0)){amt=cr;dir='in';}
      if(bb!=null) bal=bb;
    }
    const marked=money.filter(m=>m.mark||m.sign);
    if(amt==null&&marked.length){ const m=marked[0]; amt=m.v; dir=(m.mark&&/^(DB|D)$/.test(m.mark))||m.sign<0?'out':'in'; const after=money.filter(x=>x!==m&&x.x>m.x); if(after.length) bal=after[after.length-1].v; }
    if(amt==null&&money.length>=3){ const n=money.length; const a=money[n-3].v, cc=money[n-2].v; bal=money[n-1].v; if(a>0&&cc===0){amt=a;dir='out';} else if(cc>0&&a===0){amt=cc;dir='in';} }
    if(amt==null&&money.length>=2){ bal=money[money.length-1].v; amt=money[money.length-2].v; }
    if(amt==null&&money.length===1){ amt=money[0].v; }
    if(amt==null||!(amt>0)) continue;
    if(dir==null&&bal!=null&&prev!=null){ const df=bal-prev; if(Math.abs(Math.abs(df)-amt)<=1) dir=df>=0?'in':'out'; }
    if(dir==null){ if(bank==='BCA'&&money.length===1) dir='in'; else { dir=guessDir(desc); review=true; } }
    if(bal!=null&&prev!=null){ const exp=prev+(dir==='in'?amt:-amt); if(Math.abs(exp-bal)>1){ const fl=prev+(dir==='in'?-amt:amt); if(Math.abs(fl-bal)<=1) dir=dir==='in'?'out':'in'; else review=true; } }
    if(bal!=null) prev=bal; else if(prev!=null) prev+=dir==='in'?amt:-amt;
    txns.push({date:b.date,desc,amount:Math.round(amt*100)/100,dir,bal,review});
  }
  if(closing==null&&txns.length) closing=prev;
  let pfrom=null,pto=null; const pm2=all.match(/periode[^\n]{0,40}?(\d{1,2}[\s\/\-.][A-Za-z0-9]{2,9}[\s\/\-.]\d{2,4})\s*(?:-|s\.?\s?d\.?|sampai|to)\s*(\d{1,2}[\s\/\-.][A-Za-z0-9]{2,9}[\s\/\-.]\d{2,4})/i);
  if(pm2){ const a=dateAtStart(pm2[1],per.year,per.month), b=dateAtStart(pm2[2],per.year,per.month); if(a&&b&&a.iso<=b.iso){pfrom=a.iso;pto=b.iso;} }
  return {bank,last4,opening,closing,txns,name,pfrom,pto};
}
function linesFromText(text){
  const raw=text.split(/\r?\n/); const w=Math.max(40,...raw.map(s=>s.length));
  return raw.map(s=>{ const tokens=[]; const re=/\S+/g; let m; while((m=re.exec(s))) tokens.push({s:m[0],x:m.index}); return {page:1,w,text:s,tokens,paste:true}; });
}
/*PARSER-END*/

/* ---------- PDF ---------- */
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
const PDFW='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
let pdfReady=null;
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('Gagal memuat pembaca PDF')); document.head.appendChild(s); }); }
function ensurePdf(){ if(!pdfReady) pdfReady=loadScript(PDFJS).then(()=>loadScript(PDFW)).then(()=>{ window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFW; }); return pdfReady; }
async function pdfLines(file,password){
  await ensurePdf();

  const doc=await window.pdfjsLib.getDocument({data,password:password||undefined,isEvalSupported:false,disableFontFace:true}).promise;
  const out=[];
  for(let p=1;p<=doc.numPages;p++){
    const page=await doc.getPage(p); const W=page.getViewport({scale:1}).width; const tc=await page.getTextContent();
    const items=tc.items.filter(i=>i.str&&i.str.trim()).map(i=>({s:i.str,x:i.transform[4],y:i.transform[5],w:i.width||0,h:Math.abs(i.transform[3])||8}));
    items.sort((a,b)=>(b.y-a.y)||(a.x-b.x));
    const rows=[];
    for(const it of items){ const r=rows[rows.length-1]; if(r&&Math.abs(r.y-it.y)<=Math.max(2,it.h*0.4)) r.items.push(it); else rows.push({y:it.y,items:[it]}); }
    for(const r of rows){
      r.items.sort((a,b)=>a.x-b.x);
      const merged=[];
      for(const it of r.items){ const pv=merged[merged.length-1]; if(pv&&it.x-(pv.x+pv.w)<0.6&&!/\s$/.test(pv.s)){pv.s+=it.s;pv.w=it.x+it.w-pv.x;} else merged.push({...it}); }
      const tokens=[];
      for(const it of merged){ const re=/\S+/g; let m; const L=it.s.length||1; while((m=re.exec(it.s))) tokens.push({s:m[0],x:it.x+(m.index/L)*it.w}); }
      out.push({page:p,w:W,text:merged.map(i=>i.s).join(' '),tokens});
    }
  }
  return out;
}

function dataRange(){ let a=null,b=null; for(const t of S.txns){ if(!a||t.date<a)a=t.date; if(!b||t.date>b)b=t.date; } for(const m of S.manual){ if(!a||m.date<a)a=m.date; if(!b||m.date>b)b=m.date; } return [a,b]; }
function bankOpening(b){
  const tx=S.txns.filter(t=>t.acct===b.id).sort((x,y)=>x.date<y.date?-1:1); if(!tx.length) return null;
  const st=S.statements.filter(s=>s.acct===b.id&&s.opening!=null).sort((x,y)=>(x.from||'')<(y.from||'')?-1:1);
  const fd=tx[0].date;
  if(st.length) return {date:(st[0].from&&st[0].from<fd)?st[0].from:fd,amount:st[0].opening};
  let run=0; for(const t of tx){ run+=t.dir==='in'?t.amount:-t.amount; if(t.bal!=null) return {date:fd,amount:Math.round((t.bal-run)*100)/100}; }
  return {date:fd,amount:0};
}
let _gaps=null;
function gaps(){ if(_gaps) return _gaps; const out=[];
  S.banks.forEach((b,i)=>{ const o=bankOpening(b); if(!o) return; const code=bankCodeOf(i);
    const tx=S.txns.filter(t=>t.acct===b.id); const st=S.statements.filter(s=>s.acct===b.id&&s.opening!=null&&s.from).sort((x,y)=>x.from<y.from?-1:x.from>y.from?1:0);
    let adj=0;
    st.forEach((s,k)=>{ if(k===0) return; let bal=o.amount+adj; for(const t of tx) if(t.date<s.from) bal+=t.dir==='in'?t.amount:-t.amount;
      const d=Math.round((s.opening-bal)*100)/100; if(Math.abs(d)>=1){ const prev=st.slice(0,k).reduce((a,x)=>(!a||x.to>a.to)?x:a,null); out.push({code,label:AC(code).name,date:s.from,diff:d,window:(prev?fshort(addDays(prev.to,1)):'')+' – '+fshort(addDays(s.from,-1))+' '+s.from.slice(0,4)}); adj+=d; } });
  });
  return _gaps=out; }
function ENT(){
  if(_ent) return _ent; const E=[];
  S.banks.forEach((b,i)=>{ const o=bankOpening(b); if(!o||!o.amount) return; const c=bankCodeOf(i),v=o.amount;
    E.push({date:o.date,ord:0,desc:'Saldo awal '+AC(c).name,src:'open',lines:v>0?[{a:c,dr:v,cr:0},{a:'3-101',dr:0,cr:v}]:[{a:'3-101',dr:-v,cr:0},{a:c,dr:0,cr:-v}]}); });
  for(const g of gaps()) E.push({date:g.date,ord:0.5,desc:'Penyesuaian kesinambungan saldo '+g.label+' (transaksi '+g.window+' belum terunggah)',src:'adj',lines:g.diff>0?[{a:g.code,dr:g.diff,cr:0},{a:'1-199',dr:0,cr:g.diff}]:[{a:'1-199',dr:-g.diff,cr:0},{a:g.code,dr:0,cr:-g.diff}]});
  const od=S.openDate||dataRange()[0];
  if(od) for(const [c,v0] of Object.entries(S.openings||{})){ const v=Math.abs(+v0||0); if(!v) continue; const t=AC(c).type;
    E.push({date:od,ord:0,desc:'Saldo awal '+AC(c).name,src:'open',lines:(t==='A')?[{a:c,dr:v,cr:0},{a:'3-101',dr:0,cr:v}]:[{a:'3-101',dr:v,cr:0},{a:c,dr:0,cr:v}]}); }
  for(const t of S.txns){ const bc=bankCode(t.acct); if(!bc||!t.cat) continue;
    E.push({date:t.date,ord:1,desc:t.desc,src:'tx',ref:t.id,lines:t.dir==='in'?[{a:bc,dr:t.amount,cr:0},{a:t.cat,dr:0,cr:t.amount}]:[{a:t.cat,dr:t.amount,cr:0},{a:bc,dr:0,cr:t.amount}]}); }
  for(const m of S.manual) E.push({date:m.date,ord:2,desc:m.desc,src:'man',ref:m.id,lines:[{a:m.dr,dr:m.amount,cr:0},{a:m.cr,dr:0,cr:m.amount}]});
  E.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.ord-b.ord);
  E.forEach((e,i)=>e.no='J-'+String(i+1).padStart(4,'0'));
  return _ent=E;
}
function sumBy(pred){ const m={}; for(const e of ENT()){ if(!pred(e)) continue; for(const l of e.lines) m[l.a]=(m[l.a]||0)+l.dr-l.cr; } return m; }
const balAt=d=>sumBy(e=>e.date<=d);

function netWorth(b){ let a=0,l=0; for(const c in b){ if(c[0]==='1') a+=b[c]; else if(c[0]==='2') l-=b[c]; } return {a,l,nw:a-l}; }

const BLN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const BLN3=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const ROM=['','I','II','III','IV'];
function addDays(d,n){ const t=new Date(d+'T00:00:00Z'); t.setUTCDate(t.getUTCDate()+n); return t.toISOString().slice(0,10); }
function range(k){ let m;
  if(/^\d{4}$/.test(k)) return [k+'-01-01',k+'-12-31'];
  if((m=k.match(/^(\d{4})-S(\d)$/))) return m[2]==='1'?[m[1]+'-01-01',m[1]+'-06-30']:[m[1]+'-07-01',m[1]+'-12-31'];
  if((m=k.match(/^(\d{4})-Q(\d)$/))){ const y=+m[1],sm=(+m[2]-1)*3+1,em=sm+2; return [iso(y,sm,1),iso(y,em,lastDay(y,em))]; }
  m=k.match(/^(\d{4})-(\d{2})$/); const y=+m[1],mo=+m[2]; return [iso(y,mo,1),iso(y,mo,lastDay(y,mo))]; }
function keyFor(g,d){ const y=d.slice(0,4),m=+d.slice(5,7); return g==='Y'?y:g==='S'?y+'-S'+(m<=6?1:2):g==='Q'?y+'-Q'+Math.ceil(m/3):y+'-'+pad(m); }
function prevKey(k){ const [s]=range(k); return keyFor(gOf(k),addDays(s,-1)); }
function gOf(k){ return /^\d{4}$/.test(k)?'Y':/-S/.test(k)?'S':/-Q/.test(k)?'Q':'M'; }
function label(k){ let m; if(/^\d{4}$/.test(k)) return 'Tahun '+k; if((m=k.match(/^(\d{4})-S(\d)$/))) return 'Semester '+ROM[+m[2]]+' '+m[1]; if((m=k.match(/^(\d{4})-Q(\d)$/))) return 'Triwulan '+ROM[+m[2]]+' '+m[1]; m=k.match(/^(\d{4})-(\d{2})$/); return BLN[+m[2]-1]+' '+m[1]; }
function shortLabel(k){ let m; if(/^\d{4}$/.test(k)) return k; if((m=k.match(/^(\d{4})-S(\d)$/))) return 'Sem '+ROM[+m[2]]; if((m=k.match(/^(\d{4})-Q(\d)$/))) return 'TW '+ROM[+m[2]]; m=k.match(/^(\d{4})-(\d{2})$/); return BLN3[+m[2]-1]; }
const fdate=d=>{ const [y,m,dd]=d.split('-'); return (+dd)+' '+BLN[+m-1]+' '+y; };
const fshort=d=>{ const [,m,dd]=d.split('-'); return dd+' '+BLN3[+m-1]; };
function periods(g){ const [a,b]=dataRange(); if(!a) return [keyFor(g,new Date().toISOString().slice(0,10))]; const ks=[];
  for(let y=+a.slice(0,4);y<=+b.slice(0,4);y++){ if(g==='Y') ks.push(String(y)); else if(g==='S') ks.push(y+'-S1',y+'-S2'); else if(g==='Q') for(let q=1;q<=4;q++) ks.push(y+'-Q'+q); else for(let m=1;m<=12;m++) ks.push(y+'-'+pad(m)); }
  return ks.filter(k=>{ const [s,e]=range(k); return e>=a&&s<=b; }); }

/* ---------- Statement table helper ---------- */
function stmtTable(cols,rows,id){
  const tsv=[['',...cols].join('\t')];
  const body=rows.map(r=>{
    if(r.t==='sec'||r.t==='sec2'){ tsv.push(r.label); return `<tr class="${r.t}"><td colspan="${cols.length+1}">${esc(r.label)}</td></tr>`; }
    if(r.t==='note'){ tsv.push(r.label.replace(/<[^>]+>/g,'')); return `<tr class="note"><td colspan="${cols.length+1}">${r.label}</td></tr>`; }
    tsv.push([(r.code?r.code+' ':'')+r.label,...r.vals.map(v=>typeof v==='number'?Math.round(v):v)].join('\t'));
    return `<tr class="${r.t}"><td>${r.code?`<span class="mono small muted">${r.code}</span>&nbsp; `:''}${esc(r.label)}</td>${r.vals.map(v=>`<td class="num">${typeof v==='number'?acc(v):esc(v)}</td>`).join('')}</tr>`;
  }).join('');
  COPY[id]=tsv.join('\n');
  return `<div class="tw"><table class="stmt"><thead><tr><th></th>${cols.map(c=>`<th class="num">${esc(c)}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>`;

function rekapTable(){

function niceMax(v){ if(v<=0) return 1; const p=Math.pow(10,Math.floor(Math.log10(v))); for(const m of [1,1.2,1.5,2,2.5,3,4,5,6,8,10]) if(m*p>=v) return m*p; return 10*p; }
function chart12(end){
  const ey=+end.slice(0,4), em=+end.slice(5,7), pts=[];
  for(let i=11;i>=0;i--){ let y=ey,m=em-i; while(m<=0){m+=12;y--;} const s=iso(y,m,1),e=iso(y,m,lastDay(y,m)); const t=totals(flowIn(s,e)); pts.push({lab:BLN3[m-1],yr:y,m,rev:t.rev,exp:t.exp,nw:netWorth(balAt(e)).nw,has:!!(t.rev||t.exp)}); }
  while(pts.length>3&&!pts[0].has) pts.shift();
  const W=720,H=270,L=58,R=58,T=14,B=30,pw=W-L-R,ph=H-T-B;
  const mx=niceMax(Math.max(1,...pts.map(p=>Math.max(p.rev,p.exp))));
  const nws=pts.map(p=>p.nw); let nmin=Math.min(...nws),nmax=Math.max(...nws); if(nmax-nmin<1){nmax+=1;nmin-=1;} const span=nmax-nmin; nmin-=span*0.15; nmax+=span*0.15;
  const y=v=>T+ph-(v/mx)*ph, yn=v=>T+ph-((v-nmin)/(nmax-nmin))*ph, bw=pw/pts.length, b=Math.max(3,Math.min(16,(bw-8)/2));
  let g='';
  for(let i=0;i<=4;i++){ const v=mx*i/4, yy=y(v); g+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--ink)" stroke-opacity=".08" stroke-width="1"/><text x="${L-8}" y="${yy+4}" text-anchor="end" font-size="11" fill="var(--ink-3)">${short(v)}</text>`;
    const nvv=nmin+(nmax-nmin)*i/4; g+=`<text x="${W-R+8}" y="${yy+4}" font-size="11" fill="var(--c-nw)">${short(nvv)}</text>`; }
  pts.forEach((p,i)=>{ const cx=L+bw*i+bw/2;
    g+=`<rect x="${cx-b-1}" y="${y(p.rev)}" width="${b}" height="${Math.max(0,T+ph-y(p.rev))}" fill="var(--c-rev)" rx="3"><title>${p.lab} ${p.yr} · Pendapatan Rp ${rp(p.rev)}</title></rect>`;
    g+=`<rect x="${cx+1}" y="${y(p.exp)}" width="${b}" height="${Math.max(0,T+ph-y(p.exp))}" fill="var(--c-exp)" rx="3"><title>${p.lab} ${p.yr} · Beban Rp ${rp(p.exp)}</title></rect>`;
    g+=`<text x="${cx}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--ink-2)">${p.lab}${p.m===1||i===0?" '"+String(p.yr).slice(2):''}</text>`; });
  const path=pts.map((p,i)=>`${i?'L':'M'}${(L+bw*i+bw/2).toFixed(1)},${yn(p.nw).toFixed(1)}`).join(' ');
  g+=`<path d="${path}" fill="none" stroke="var(--c-nw)" stroke-width="2.5" stroke-linejoin="round"/>`;
  pts.forEach((p,i)=>{ g+=`<circle cx="${L+bw*i+bw/2}" cy="${yn(p.nw)}" r="${i===pts.length-1?4:2.5}" fill="${i===pts.length-1?'var(--c-nw)':'var(--sheet)'}" stroke="var(--c-nw)" stroke-width="1.5"><title>Kekayaan bersih akhir ${p.lab} ${p.yr}: Rp ${rp(p.nw)}</title></circle>`; });
  g+=`<line x1="${L}" x2="${W-R}" y1="${T+ph}" y2="${T+ph}" stroke="var(--rule-2)"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Pendapatan, beban, dan kekayaan bersih bulanan">${g}</svg>`;
}

function vSurplus(){

  const L=ACCTS().list, rows=[], t1=totals(f1), t0=totals(f0);

  return `<div class="sheet">${stmtHead('Laporan Surplus / Defisit','Untuk periode '+fdate(s)+' s.d. '+fdate(e),'surplus')}${stmtTable([label(U.key),'% pendapatan',label(pk)],rows,'surplus')}</div>`;

function cashFlows(s,e){
  const fl={}; let open=0;
  for(const x of ENT()){
    if(x.date>e) break;
    const cashNet=x.lines.reduce((a,l)=>a+(isCash(l.a)?l.dr-l.cr:0),0);
    if(x.date<s||x.src==='open'){ if(x.date<=e) open+=cashNet; continue; }
    if(Math.abs(cashNet)<0.005) continue;
    for(const l of x.lines){ if(isCash(l.a)) continue; fl[l.a]=(fl[l.a]||0)+(l.cr-l.dr); }
  }
  return {fl,open};
}

function sheetOf(title,sub,tsv){
  const rows=[[titleCase(S.owner)||'Pribadi'],[title],[sub+' · dalam Rupiah'],[]].concat(aoa(tsv));
  const ws=XLSX.utils.aoa_to_sheet(rows); const w=[];
  rows.forEach((r,ri)=>r.forEach((c,ci)=>{ if(ri<3) return; const L=String(c).length; w[ci]=Math.min(60,Math.max(w[ci]||8,L+2)); const ref=XLSX.utils.encode_cell({r:ri,c:ci}); if(ws[ref]&&ws[ref].t==='n') ws[ref].z='#,##0;(#,##0);"-"'; }));

function ingest(res,label4,bankOverride){
  if(!res.txns.length){ toast('Tidak ada transaksi yang terbaca dari '+res.name+'. Coba fitur tempel teks.'); return 0; }
  if(S.sample){ const keep={owner:S.owner,rules:S.rules}; S=blank(); S.owner=keep.owner; S.rules=keep.rules; U.key=null; }
  const bank=bankOverride||res.bank, last4=label4||res.last4||'';
  const id=bank+'-'+(last4||'XXXX');
  if(!S.banks.find(b=>b.id===id)) S.banks.push({id,bank,last4});
  const sig=t=>[t.acct,t.date,Math.round(t.amount),t.dir,t.desc.slice(0,40),t.bal==null?'':Math.round(t.bal)].join('|');
  const have=new Set(S.txns.map(sig)); const sid=uid(); const fresh=new Set(); let tin=0,tout=0,n=0;
  for(const t of res.txns){ const o={id:uid(),date:t.date,acct:id,desc:t.desc,amount:t.amount,dir:t.dir,bal:t.bal,stmt:sid,parseReview:t.review}; if(have.has(sig(o))) continue; have.add(sig(o)); S.txns.push(o); fresh.add(o.id); n++; if(o.dir==='in') tin+=o.amount; else tout+=o.amount; }
  const ds=res.txns.map(t=>t.date).sort();
  let recon='n/a',diff=0; if(res.opening!=null&&res.closing!=null){ const all=res.txns.reduce((a,t)=>a+(t.dir==='in'?t.amount:-t.amount),0); diff=Math.round((res.opening+all-res.closing)*100)/100; recon=Math.abs(diff)<1?'ok':'selisih'; }
  S.statements.push({id:sid,name:res.name,bank,last4,acct:id,opening:res.opening,closing:res.closing,from:res.pfrom||ds[0],to:res.pto||ds[ds.length-1],count:n,tin,tout,recon,diff});
  S.txns.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  _acc=null; categorizeAll(fresh); const p=pairTransfers(); changed();
  toast(`${res.name}: ${n} transaksi baru dicatat${res.txns.length-n?`, ${res.txns.length-n} duplikat dilewati`:''}${p?`, ${p} pasangan transfer dikenali`:''}.`);
  return n;
}
async function readPdf(file,pw){
  try{ const lines=await pdfLines(file,pw); const res=parseStatement(lines,file.name.replace(/\.pdf$/i,'')); ingest(res); return true; }
  catch(e){ if(e&&e.name==='PasswordException'){ const ex=U.pending.find(p=>p.file===file); if(ex) ex.wrong=!!pw; else U.pending.push({file,wrong:!!pw}); return false; }
    toast('Gagal membaca '+file.name+': '+(e&&e.message||e)); return false; }
}
async function handleFiles(files){
  const list=[...files].filter(f=>/pdf$/i.test(f.type)||/\.pdf$/i.test(f.name)); if(!list.length){ toast('Pilih file PDF.'); return; }
  U.busy=true; render(); for(const f of list) await readPdf(f); U.busy=false; render();
}

async function persistCloud(){ if(SAVING) return; SAVING=true;
  try{ while(PENDING&&SESSION&&SESSION.cloud){ PENDING=false; const sess=SESSION; setSync('saving'); const blob=await encObj(sess.key,S);
      const {data,error}=await SB.from('vaults').update({data:blob,version:sess.version+1,updated_at:new Date().toISOString()}).eq('user_id',sess.acct.id).eq('version',sess.version).select('version');
      if(SESSION!==sess) break;
      if(error){ setSync('err'); toast('Gagal menyimpan ke server: '+sbErr(error)+' Perubahan akan dicoba lagi.'); PENDING=true; setTimeout(()=>{ if(PENDING) persistCloud(); },8000); break; }
      if(!data||!data.length){ PENDING=false; await cloudPull(true); break; }
      sess.version=data[0].version; setSync('ok'); }
  } finally{ SAVING=false; } }
async function cloudPull(conflict){ const sess=SESSION; if(!sess||!sess.cloud) return;

  try{ await sbInit(); }catch(e){ auth.innerHTML=`<div class="auth-card"><div class="alogo">D</div><h1>Dana e-Statement</h1><p class="auth-msg err">Pustaka Supabase gagal dimuat. Periksa koneksi internet lalu muat ulang halaman.</p></div>`; return; }
  try{ const {data,error}=await SB.from('app_settings').select('open_signup').eq('id',1).maybeSingle(); if(error) throw error; CLOUD_OPEN=data?data.open_signup:true; }
  catch(e){ cloudAuthView('login',sbErr(e)); return; }
  if(isRec){ setTimeout(()=>{ if(!RECOVERY) cloudAuthView('forgot','Tautan atur ulang sudah kedaluwarsa atau sudah dipakai. Kirim ulang tautan.'); },6000); return; }
  if(isSignup){ try{ await SB.auth.signOut(); }catch(e){} history.replaceState(null,'',redirectUrl()); cloudAuthView('login','Email terkonfirmasi. Silakan masuk.','info'); return; }
  if(hashErr){ history.replaceState(null,'',redirectUrl()); cloudAuthView('login',decodeURIComponent(hashErr[1].replace(/\+/g,' '))); return; }
  cloudAuthView('login');
}

  <p class="small muted">Isi dari Supabase → Project Settings → API. Pengaturan ini hanya untuk browser ini; agar berlaku di semua perangkat, isi di bagian atas file index.html.</p>
  <div class="field" style="margin-top:8px"><label for="cfgUrl">Project URL</label><input class="inp" id="cfgUrl" placeholder="https://xxxx.supabase.co" autocomplete="off"></div>
  <div class="field" style="margin-top:8px"><label for="cfgKey">Anon public key</label><input class="inp" id="cfgKey" placeholder="eyJhbGciOi…" autocomplete="off"></div>
  <button class="btn pri" data-act="cloudon" style="margin-top:10px">Hubungkan</button></details>`; }

function bootAuth(){
  if(!(window.crypto&&crypto.subtle)){ document.getElementById('auth').innerHTML='<div class="auth-card"><h1>Dana e-Statement</h1><p class="auth-msg err">Browser ini tidak mendukung enkripsi. Buka situs lewat alamat https dengan browser terbaru.</p></div>'; return; }
  CLOUD=STANDALONE&&!!cloudCfg();
  if(CLOUD) bootCloud(); else { seedAccount(); showAuth(null); }
  ['pointerdown','keydown','wheel','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{ lastAct=Date.now(); },{passive:true}));
  setInterval(()=>{ if(SESSION&&Date.now()-lastAct>IDLE_MIN*60000) logout('Sesi dikunci otomatis setelah '+IDLE_MIN+' menit tidak aktif.'); },20000);
}
document.addEventListener('submit',ev=>{ ev.preventDefault(); const i=ev.target.id; if(i==='loginForm') doLogin(); else if(i==='signupForm') doSignup(); else if(i==='cLoginForm') cDoLogin(); else if(i==='cSignupForm') cDoSignup(); else if(i==='cForgotForm') cDoForgot(); else if(i==='cNewPwForm') cDoNewPw(); else if(i==='cRecoverForm') cDoRecover(); });
document.getElementById('side').addEventListener('click',ev=>{ if(ev.target.closest('a[href^="#"]')) setNav(false); });
document.addEventListener('keydown',ev=>{ if(ev.key==='Escape'&&document.getElementById('side').classList.contains('open')) setNav(false); });
